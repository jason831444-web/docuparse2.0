services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: docuparse
      POSTGRES_USER: docuparse
      POSTGRES_PASSWORD: docuparse
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuparse -d docuparse"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    profiles:
      - backend
    build:
      context: ./backend
      args:
        INSTALL_OCR_DEPS: ${INSTALL_OCR_DEPS:-true}
        INSTALL_LLAMA_CPP_DEPS: ${INSTALL_LLAMA_CPP_DEPS:-true}
        INSTALL_AI_DEPS: ${INSTALL_AI_DEPS:-false}
    environment:
      DATABASE_URL: postgresql+psycopg://docuparse:docuparse@db:5432/docuparse
      UPLOAD_DIR: /app/uploads
      BACKEND_BASE_URL: http://localhost:8001
      CORS_ORIGINS: '["http://localhost:3001"]'
      STORAGE_BACKEND: local
      PROCESSING_MODE: inline
      QUEUE_BACKEND: local
      AI_INTERPRETATION_ENABLED: ${AI_INTERPRETATION_ENABLED:-false}
      AI_INTERPRETATION_PROVIDER: ${AI_INTERPRETATION_PROVIDER:-llama_cpp}
      AI_INTERPRETATION_MODEL: ${AI_INTERPRETATION_MODEL:-gguf-local}
      AI_INTERPRETATION_FALLBACK_MODEL: ${AI_INTERPRETATION_FALLBACK_MODEL:-google/gemma-2-2b-it}
      AI_INTERPRETATION_ENABLE_MODEL_FALLBACK: ${AI_INTERPRETATION_ENABLE_MODEL_FALLBACK:-true}
      AI_INTERPRETATION_FORCE_SMALL_MODEL: ${AI_INTERPRETATION_FORCE_SMALL_MODEL:-false}
      AI_INTERPRETATION_LOCAL_PREFER_SMALL_MODEL: ${AI_INTERPRETATION_LOCAL_PREFER_SMALL_MODEL:-false}
      LLAMA_CPP_MODEL_PATH: /models/gguf/${LLAMA_CPP_MODEL_FILE:-gemma-3-4b-it-q4_0.gguf}
      LLAMA_CPP_CONTEXT_WINDOW: ${LLAMA_CPP_CONTEXT_WINDOW:-4096}
      LLAMA_CPP_THREADS: ${LLAMA_CPP_THREADS:-0}
      LLAMA_CPP_GPU_LAYERS: ${LLAMA_CPP_GPU_LAYERS:-0}
      LLAMA_CPP_MAX_TOKENS: ${LLAMA_CPP_MAX_TOKENS:-700}
      LLAMA_CPP_TEMPERATURE: ${LLAMA_CPP_TEMPERATURE:-0.1}
      AI_PRIMARY_PROVIDER: ${AI_PRIMARY_PROVIDER:-paddleocr_vl_1_6_gguf}
      AI_SECONDARY_PROVIDER: heuristic_fallback
      AI_ENABLE_SECOND_PASS: "false"
      AI_SECOND_PASS_CONFIDENCE_THRESHOLD: "0.80"
      AI_MODEL_DIR: /app/models
      OCR_FALLBACK_PROVIDER: paddleocr_ppocrv4
      ENABLE_PADDLEOCR_VL_GGUF: ${ENABLE_PADDLEOCR_VL_GGUF:-true}
      PADDLEOCR_VL_GGUF_REPO_ID: ${PADDLEOCR_VL_GGUF_REPO_ID:-PaddlePaddle/PaddleOCR-VL-1.6-GGUF}
      PADDLEOCR_VL_GGUF_MODEL_DIR: /app/models/paddleocr_vl_1_6_gguf
      PADDLEOCR_VL_GGUF_MODEL_FILE: ${PADDLEOCR_VL_GGUF_MODEL_FILE:-PaddleOCR-VL-1.6-GGUF.gguf}
      PADDLEOCR_VL_GGUF_MMPROJ_FILE: ${PADDLEOCR_VL_GGUF_MMPROJ_FILE:-PaddleOCR-VL-1.6-GGUF-mmproj.gguf}
      PADDLEOCR_VL_GGUF_SERVER_URL: ${PADDLEOCR_VL_GGUF_SERVER_URL:-http://vl-worker-gguf:8080/v1}
      PADDLEOCR_VL_GGUF_WORKER_URL: ${PADDLEOCR_VL_GGUF_WORKER_URL:-http://vl-worker-api:8020}
      PADDLEOCR_VL_GGUF_TIMEOUT_SECONDS: ${PADDLEOCR_VL_GGUF_TIMEOUT_SECONDS:-240}
      PADDLEOCR_VL_GGUF_MAX_PAGES: ${PADDLEOCR_VL_GGUF_MAX_PAGES:-1}
      PADDLEOCR_VL_GGUF_CONCURRENCY: ${PADDLEOCR_VL_GGUF_CONCURRENCY:-1}
      PADDLEOCR_VL_GGUF_SMOKE_PASSED: ${PADDLEOCR_VL_GGUF_SMOKE_PASSED:-false}
      PADDLEOCR_VL_GGUF_PRIMARY_READER_ENABLED: ${PADDLEOCR_VL_GGUF_PRIMARY_READER_ENABLED:-true}
      PADDLEOCR_VL_GGUF_UPLOAD_PIPELINE_ENABLED: ${PADDLEOCR_VL_GGUF_UPLOAD_PIPELINE_ENABLED:-true}
      PADDLEOCR_VL_GGUF_IN_PROCESS_ENABLED: ${PADDLEOCR_VL_GGUF_IN_PROCESS_ENABLED:-false}
      ENABLE_PADDLEOCR_VL: ${ENABLE_PADDLEOCR_VL:-false}
      PADDLEOCR_VL_MODEL_NAME: ${PADDLEOCR_VL_MODEL_NAME:-PaddleOCR-VL-1.6}
      PADDLEOCR_VL_HF_REPO: ${PADDLEOCR_VL_HF_REPO:-PaddlePaddle/PaddleOCR-VL-1.6}
      PADDLEOCR_VL_MODEL_DIR: ${PADDLEOCR_VL_MODEL_DIR:-}
      PADDLEOCR_VL_DEVICE: cpu
      PADDLEOCR_VL_TIMEOUT_SECONDS: ${PADDLEOCR_VL_TIMEOUT_SECONDS:-180}
      PADDLEOCR_TIMEOUT_SECONDS: ${PADDLEOCR_TIMEOUT_SECONDS:-600}
      OCR_WORKER_URL: ${OCR_WORKER_URL:-http://ocr-worker:8010}
      PREFER_OCR_WORKER: ${PREFER_OCR_WORKER:-true}
      OCR_WORKER_TIMEOUT_SECONDS: ${OCR_WORKER_TIMEOUT_SECONDS:-300}
      LOCAL_PADDLEOCR_ENABLED: ${LOCAL_PADDLEOCR_ENABLED:-false}
      FLAGS_use_onednn: "0"
      FLAGS_use_mkldnn: "0"
      FLAGS_enable_pir_api: "0"
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      PADDLE_DISABLE_SIGNAL_HANDLER: "1"
    ports:
      - "8001:8000"
    volumes:
      - uploaded_files:/app/uploads
      - model_cache:/app/models
      - ${PADDLEOCR_VL_GGUF_HOST_MODEL_DIR:-./models/paddleocr_vl_1_6_gguf}:/app/models/paddleocr_vl_1_6_gguf:ro
      - ./models/gguf:/models/gguf:ro
    depends_on:
      db:
        condition: service_healthy
      ocr-worker:
        condition: service_started

  ocr-worker:
    profiles:
      - backend
    build:
      context: ./backend
      args:
        INSTALL_OCR_DEPS: ${INSTALL_OCR_DEPS:-true}
        INSTALL_LLAMA_CPP_DEPS: "false"
        INSTALL_AI_DEPS: "false"
    command: ["uvicorn", "app.services.ocr_worker_server:app", "--host", "0.0.0.0", "--port", "8010"]
    restart: unless-stopped
    environment:
      UPLOAD_DIR: /app/uploads
      PADDLEOCR_CACHE_DIR: /root/.paddlex
      PADDLEOCR_DEVICE: ${PADDLEOCR_DEVICE:-cpu}
      PADDLEOCR_LANG: ${PADDLEOCR_LANG:-korean}
      PADDLEOCR_OCR_VERSION: ${PADDLEOCR_OCR_VERSION:-PP-OCRv4}
      OCR_WORKER_RESET_AFTER_REQUESTS: ${OCR_WORKER_RESET_AFTER_REQUESTS:-2}
      FLAGS_use_onednn: "0"
      FLAGS_use_mkldnn: "0"
      FLAGS_enable_pir_api: "0"
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      PADDLE_DISABLE_SIGNAL_HANDLER: "1"
    ports:
      - "8010:8010"
    volumes:
      - uploaded_files:/app/uploads
      - paddleocr_cache:/root/.paddlex
      - paddleocr_whl_cache:/root/.paddleocr
      - model_cache:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8010/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: /api
        DOCUPARSE_BACKEND_INTERNAL_URL: http://backend:8000
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api
      DOCUPARSE_BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "3001:3000"

  vl-worker-gguf:
    profiles:
      - vl
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    command:
      - -m
      - /app/models/paddleocr_vl_1_6_gguf/${PADDLEOCR_VL_GGUF_MODEL_FILE:-PaddleOCR-VL-1.6-GGUF.gguf}
      - --mmproj
      - /app/models/paddleocr_vl_1_6_gguf/${PADDLEOCR_VL_GGUF_MMPROJ_FILE:-PaddleOCR-VL-1.6-GGUF-mmproj.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --temp
      - "0"
      - -t
      - "${PADDLEOCR_VL_GGUF_THREADS:-2}"
      - -c
      - "${PADDLEOCR_VL_GGUF_CONTEXT:-4096}"
    expose:
      - "8080"
    volumes:
      - ${PADDLEOCR_VL_GGUF_HOST_MODEL_DIR:-./models/paddleocr_vl_1_6_gguf}:/app/models/paddleocr_vl_1_6_gguf:ro

  vl-worker-api:
    profiles:
      - vl
    build:
      context: ./backend
      args:
        INSTALL_OCR_DEPS: "true"
        INSTALL_LLAMA_CPP_DEPS: "false"
        INSTALL_AI_DEPS: "true"
    command: ["uvicorn", "app.services.vl_worker_server:app", "--host", "0.0.0.0", "--port", "8020"]
    restart: unless-stopped
    environment:
      UPLOAD_DIR: /app/uploads
      AI_PRIMARY_PROVIDER: paddleocr_vl_1_6_gguf
      ENABLE_PADDLEOCR_VL_GGUF: "true"
      PADDLEOCR_VL_GGUF_MODEL_DIR: /app/models/paddleocr_vl_1_6_gguf
      PADDLEOCR_VL_GGUF_MODEL_FILE: ${PADDLEOCR_VL_GGUF_MODEL_FILE:-PaddleOCR-VL-1.6-GGUF.gguf}
      PADDLEOCR_VL_GGUF_MMPROJ_FILE: ${PADDLEOCR_VL_GGUF_MMPROJ_FILE:-PaddleOCR-VL-1.6-GGUF-mmproj.gguf}
      PADDLEOCR_VL_GGUF_SERVER_URL: ${PADDLEOCR_VL_GGUF_SERVER_URL:-http://vl-worker-gguf:8080/v1}
      PADDLEOCR_VL_GGUF_TIMEOUT_SECONDS: ${PADDLEOCR_VL_GGUF_TIMEOUT_SECONDS:-240}
      PADDLEOCR_VL_GGUF_MAX_PAGES: ${PADDLEOCR_VL_GGUF_MAX_PAGES:-1}
      PADDLEOCR_VL_GGUF_CONCURRENCY: ${PADDLEOCR_VL_GGUF_CONCURRENCY:-1}
      PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
      PADDLE_DISABLE_SIGNAL_HANDLER: "1"
    expose:
      - "8020"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8020/health', timeout=5).read()\""]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    volumes:
      - uploaded_files:/app/uploads
      - ${PADDLEOCR_VL_GGUF_HOST_MODEL_DIR:-./models/paddleocr_vl_1_6_gguf}:/app/models/paddleocr_vl_1_6_gguf:ro
    depends_on:
      - vl-worker-gguf

volumes:
  postgres_data:
  uploaded_files:
  model_cache:
  paddleocr_cache:
  paddleocr_whl_cache:
